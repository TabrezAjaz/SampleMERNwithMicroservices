apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.hello.name }}
  labels: { app: {{ .Values.hello.name }} }
spec:
  replicas: {{ .Values.hello.replicas }}
  selector:
    matchLabels: { app: {{ .Values.hello.name }} }
  template:
    metadata:
      labels: { app: {{ .Values.hello.name }} }
    spec:
      containers:
        - name: {{ .Values.hello.name }}
          image: "{{ .Values.imageRegistry }}/{{ .Values.hello.repo }}:{{ .Values.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - containerPort: {{ .Values.hello.port }}
          env:
            - name: PORT
              value: "{{ .Values.hello.port }}"
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.hello.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.hello.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.hello.name }}
  labels: { app: {{ .Values.hello.name }} }
spec:
  type: ClusterIP
  selector: { app: {{ .Values.hello.name }} }
  ports:
    - port: {{ .Values.hello.port }}
      targetPort: {{ .Values.hello.port }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.hello.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.hello.name }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
